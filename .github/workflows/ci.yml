name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and unit/API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck + shared, API (real Postgres) and web tests
        run: docker compose -f docker-compose.test.yml run --rm --build api-test npm run ci
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  e2e:
    name: End-to-end (Playwright against docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack from a clean checkout and run Playwright
        env:
          CI: 'true'
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait web && docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --build e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
