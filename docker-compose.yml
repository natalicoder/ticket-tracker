name: ticketing

services:
  secrets-init:
    image: alpine:3.20
    command:
      - sh
      - -c
      - "[ -s /secrets/db_password ] || (head -c 48 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 32 > /secrets/db_password); chmod 444 /secrets/db_password"
    volumes:
      - secrets:/secrets

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_DB: ticketing
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_USER: ticketing
      DB_NAME: ticketing
      DB_PASSWORD_FILE: /secrets/db_password
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Ticketing <no-reply@ticketing.local>}
    volumes:
      - secrets:/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_SHOW_MAILPIT_LINK: ${SHOW_MAILPIT_LINK:-true}
        VITE_MAILPIT_PORT: ${MAILPIT_PORT:-8025}
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  secrets:
