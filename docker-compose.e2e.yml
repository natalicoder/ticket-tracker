# End-to-end run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait web && docker compose -f docker-compose.yml -f docker-compose.e2e.yml run --rm --build e2e
# The tests read verification emails from Mailpit, so this override turns Mailpit on and routes the API's mail to it.
services:
  mailpit:
    profiles: !reset []

  api:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      mailpit:
        condition: service_started

  e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      BASE_URL: http://web
      MAILPIT_URL: http://mailpit:8025
      CI: ${CI:-}
      RECORD_VIDEO: ${RECORD_VIDEO:-}
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
