server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;

  # Resolve the api container on every request (Docker DNS, 10 s cache): after `docker compose restart api`
  # it can come back on a new IP, and a hostname fixed at nginx start would answer 502 until web restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the API trusts this header for its auth rate limit, so clients must not spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
